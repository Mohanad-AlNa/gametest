<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17132e"/>
      <stop offset="100%" stop-color="#0d0b1e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Decorative rings -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="#a855f7" stroke-width="6" stroke-dasharray="22 14" opacity="0.5"/>
  <circle cx="256" cy="220" r="108" fill="none" stroke="#06b6d4" stroke-width="5" stroke-dasharray="18 12" opacity="0.4"/>
  <circle cx="256" cy="220" r="76"  fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="14 10" opacity="0.35"/>
  <!-- Letter E -->
  <text x="256" y="310" font-family="Arial Black, Arial" font-size="240" font-weight="900"
        fill="url(#g)" text-anchor="middle">E</text>
  <!-- Subtitle bar -->
  <rect x="96" y="390" width="320" height="52" rx="26" fill="url(#g)" opacity="0.15"/>
  <text x="256" y="424" font-family="Arial, sans-serif" font-size="30" font-weight="700"
        fill="url(#g)" text-anchor="middle" letter-spacing="4">ECHO</text>
</svg>
